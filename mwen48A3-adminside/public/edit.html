<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit event</title><link rel="stylesheet" href="./css/style.css"></head>
<body><nav class="nav"><strong>Harbour Hope staff</strong><div><a href="./">All events</a><a href="./edit.html">New event</a><a id="public-link" target="_blank" rel="noreferrer">Public site</a></div></nav><main class="container section"><p><a href="./">Back to all events</a></p><h1 id="heading">New event</h1><form id="event-form" class="panel"><div class="form-grid"><label>Title<input name="title" required minlength="3"></label><label>Category<select name="category_id" id="category" required></select></label><label>City<input name="city" required></label><label>Venue<input name="venue" required></label><label>Start<input name="start_time" type="datetime-local" required></label><label>End<input name="end_time" type="datetime-local" required></label><label>Status<select name="status"><option value="active">Active</option><option value="suspended">Suspended</option></select></label><label>Capacity<input name="capacity" type="number" min="1" value="100" required></label><label>Goal amount<input name="goal_amount" type="number" min="0" step="0.01" value="0" required></label><label>Raised amount<input name="raised_amount" type="number" min="0" step="0.01" value="0" required></label><label>Image URL<input name="hero_image_url" type="url"></label><label>Address<input name="address"></label></div><label>Short description<textarea name="short_desc"></textarea></label><label>Full description<textarea name="full_desc"></textarea></label><p id="message" class="message" role="alert"></p><button>Save event</button></form><section id="registration-panel" class="panel section" hidden><h2>Registrations</h2><ul id="registrations" class="registration-list"></ul></section></main><script src="./js/config.js"></script><script src="./js/api.js"></script><script>document.querySelector('#public-link').href = window.APP_CONFIG.PUBLIC_URL;</script><script src="./js/edit.js"></script></body></html>
