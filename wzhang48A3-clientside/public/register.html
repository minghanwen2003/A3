<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register for an event</title><link rel="stylesheet" href="./css/style.css"></head>
<body><nav class="nav"><a class="brand" href="./">Harbour Hope</a><div class="nav-links"><a href="./">Home</a><a href="./search.html">Find events</a><a id="admin-link" target="_blank" rel="noreferrer">Staff admin</a></div></nav>
<main class="container section"><p><a id="back" href="./search.html">Back to events</a></p><h1>Register for an event</h1><div id="event-summary" class="panel">Loading event...</div><form id="registration-form" class="panel section" hidden><div class="form-grid"><label>Full name<input name="full_name" minlength="2" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" type="tel"></label><label>Tickets<input name="tickets" type="number" min="1" max="20" value="1" required></label><label>Registration date<input name="registration_date" id="registration-date" type="datetime-local" required></label></div><button>Confirm registration</button><p id="form-message" class="error" role="alert"></p></form><p id="success" class="notice" hidden></p></main>
<script src="./js/config.js"></script><script src="./js/api.js"></script><script>document.querySelector('#admin-link').href = window.APP_CONFIG.ADMIN_URL;</script><script src="./js/register.js"></script></body></html>
